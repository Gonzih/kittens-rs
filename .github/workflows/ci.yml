name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
          targets: thumbv7em-none-eabi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo run -p kittens-render --example host_sweep
      - run: cargo test -p kittens --doc --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - run: cargo build -p kittens-no-std-fixture -p kittens-feature-unifier --target thumbv7em-none-eabi --release --bins
      - run: test "$(cargo tree -p kittens-render --no-default-features -e normal --prefix none | wc -l)" -eq 1
      - run: cargo build -p kittens-render --no-default-features --target thumbv7em-none-eabi --release
      - run: cargo build -p kittens-render --no-default-features --features embedded-graphics --target thumbv7em-none-eabi --release
      - run: cargo build -p kittens-render-no-std-fixture --target thumbv7em-none-eabi --release

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and check the GitHub Pages artifact
        run: |
          node website/scripts/build.mjs
          node website/scripts/check.mjs website/dist
          node website/scripts/repro.mjs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Lines and functions are hard gates. Region percentage is deliberately
      # informational: the residual regions are compiler-synthesized and have
      # no distinct uncovered source line or function (TUI SPEC section 9).
      - name: Enforce behavioral line and function coverage
        run: >-
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex
          'crates/kittens-tui/src/(input|terminal)/production\.rs$'
          --fail-under-lines 100
          --fail-under-functions 100
          --fail-uncovered-lines 0
          --fail-uncovered-functions 0
          --summary-only

  rust-1-85:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo +1.85.0 check -p kittens --no-default-features --features macros
      - run: cargo +1.85.0 check -p kittens --all-features
      - run: cargo +1.85.0 check -p kittens-render --no-default-features
      - run: cargo +1.85.0 check -p kittens-render --no-default-features --features embedded-graphics
      - run: cargo +1.85.0 check -p kittens-renamed-dependency-fixture
