[package]
name = "kittens-render-xtensa-probe"
version = "0.0.0"
edition = "2024"
publish = false

# This firmware deliberately does not join the monorepo workspace. It needs
# the Espressif Rust toolchain and the exact audited esp-hal git revision.
[workspace]

[dependencies]
critical-section = "1"
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "d48f747ba28accdc51779ba193eba923138e0382", default-features = false, features = [
    "esp32s3",
    "rt",
    "unstable",
] }
kittens-render = { path = "../../crates/kittens-render", default-features = false, features = [
    "esp32s3-sh8601-blocking",
] }

[[bin]]
name = "kittens-render-xtensa-probe"
path = "src/main.rs"
test = false
bench = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
