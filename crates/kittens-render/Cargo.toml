[package]
name = "kittens-render"
description = "Experimental 0.1.x evidence release for embedded rendering and interaction on the Kittens reactor kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["embedded", "rendering", "no-std", "reactor", "orchestration"]
categories = ["embedded", "no-std", "rendering"]
readme = "README.md"
publish = true

[features]
default = []
embedded-graphics = ["dep:embedded-graphics"]
esp32s3-sh8601-blocking = ["dep:esp-hal"]

[dependencies]
embedded-graphics = { workspace = true, optional = true }

[target.'cfg(target_arch = "xtensa")'.dependencies.esp-hal]
version = "=1.1.0"
git = "https://github.com/esp-rs/esp-hal"
rev = "d48f747ba28accdc51779ba193eba923138e0382"
optional = true
default-features = false
features = ["esp32s3", "unstable"]

[dev-dependencies]
kittens.workspace = true
tokio.workspace = true
trybuild.workspace = true

[lints]
workspace = true
