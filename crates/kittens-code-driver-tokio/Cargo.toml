[package]
name = "kittens-code-driver-tokio"
description = "Tokio driver for the kittens-code core: reactor loop, log appender, model clients (live + deterministic jail), and tool discharge"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
kittens = { workspace = true, features = ["tokio"] }
kittens-code-core = { workspace = true }
kittens-code-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
# Real Anthropic-dialect endpoint client (G10 smoke); off in unit CI.
live = []

[lints]
workspace = true
