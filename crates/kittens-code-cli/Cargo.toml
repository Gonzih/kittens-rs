[package]
name = "kittens-code-cli"
description = "Headless composition-root binary for kittens-code KC0"
readme = "README.md"
keywords = ["agent", "llm", "harness", "coding-agent", "cli"]
categories = ["development-tools", "command-line-utilities"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "kittens-code"
path = "src/main.rs"

[dependencies]
kittens-code-core = { workspace = true }
kittens-code-driver-tokio = { workspace = true }
kittens-code-protocol = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util"] }

[dev-dependencies]
tempfile = "3"

[features]
live = ["kittens-code-driver-tokio/live"]

[lints]
workspace = true
