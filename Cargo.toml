[workspace]
members = [
    "crates/kittens",
    "crates/kittens-code-core",
    "crates/kittens-code-cli",
    "crates/kittens-code-driver-tokio",
    "crates/kittens-code-protocol",
    "crates/kittens-macros",
    "crates/kittens-tui",
    "fixtures/code-no-std",
    "fixtures/feature-unifier",
    "fixtures/no-std",
    "fixtures/renamed-dependency",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gonzih/kittens-rs"
rust-version = "1.85"
version = "0.1.1"

[workspace.dependencies]
crossterm = "0.29"
kittens = { path = "crates/kittens", version = "0.1.1" }
kittens-code-core = { path = "crates/kittens-code-core", version = "0.1.1" }
kittens-code-driver-tokio = { path = "crates/kittens-code-driver-tokio", version = "0.1.1" }
kittens-code-protocol = { path = "crates/kittens-code-protocol", version = "0.1.1" }
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1.0", default-features = false, features = [
    "alloc",
] }
kittens-macros = { path = "crates/kittens-macros", version = "0.1.1" }
proc-macro-crate = "3.4"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
tokio = { version = "1.53", default-features = false, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
trybuild = "1.0"

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kittens_doc_cfg)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
